<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#F8FAFD" media="(prefers-color-scheme:light)">
<meta name="theme-color" content="#131314" media="(prefers-color-scheme:dark)">
<meta name="robots" content="noindex">
<title>Page not found — Kalithas Govindaraj</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --primary:#0B57D0; --on-primary:#FFFFFF;
  --surface:#F8FAFD; --on-surface:#1F1F1F; --on-surface-variant:#444746;
  --outline:#747775;
}
@media (prefers-color-scheme:dark){
  :root{
    --primary:#A8C7FA; --on-primary:#062E6F;
    --surface:#131314; --on-surface:#E3E3E3; --on-surface-variant:#C4C7C5;
    --outline:#8E918F;
  }
}
*{box-sizing:border-box}
body{
  margin:0; min-height:100vh; display:grid; place-items:center;
  padding:clamp(16px,5vw,48px);
  background:var(--surface); color:var(--on-surface);
  font-family:'Roboto',system-ui,-apple-system,'Segoe UI',Arial,sans-serif;
  -webkit-font-smoothing:antialiased;
}
main{max-width:34rem; text-align:center}
.code{
  font-size:clamp(56px,14vw,96px); line-height:1; font-weight:700;
  letter-spacing:-.02em; color:var(--primary); margin:0 0 8px;
}
h1{font-size:clamp(20px,4vw,28px); font-weight:500; margin:0 0 12px}
p{color:var(--on-surface-variant); line-height:1.6; margin:0 0 28px}
.actions{display:flex; flex-wrap:wrap; gap:12px; justify-content:center}
a.btn{
  display:inline-flex; align-items:center; justify-content:center;
  min-height:40px; padding:0 24px; border-radius:999px;
  font-size:14px; font-weight:500; text-decoration:none;
  transition:opacity .15s ease;
}
a.btn:hover{opacity:.9}
a.btn:focus-visible{outline:3px solid var(--primary); outline-offset:2px}
.filled{background:var(--primary); color:var(--on-primary)}
.outlined{border:1px solid var(--outline); color:var(--primary)}
</style>
</head>
<body>
<main>
  <p class="code">404</p>
  <h1>That page doesn&rsquo;t exist</h1>
  <p>The link may be out of date, or the address mistyped. Everything lives on the one page &mdash; head back and pick up from there.</p>
  <div class="actions">
    <a class="btn filled" href="/">Back to portfolio</a>
    <a class="btn outlined" href="mailto:kalithas878@gmail.com">Email me</a>
  </div>
</main>
</body>
</html>
